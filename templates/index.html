<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAZIGHO Site Cloner</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-slate-100"><main class="mx-auto max-w-2xl px-6 py-16"><p class="mb-3 text-sm font-semibold uppercase tracking-[.25em] text-cyan-300">MAZIGHO / import</p><h1 class="text-4xl font-bold">Cloner une boutique</h1><p class="mt-3 text-slate-400">Importez la structure et le catalogue d’un site public. Aucune donnée de paiement, de checkout ou de client n’est collectée.</p><form id="clone-form" class="mt-10 space-y-4 rounded-2xl bg-white/5 p-6 ring-1 ring-white/10"><label class="block text-sm">URL de la boutique<input id="url" required type="url" placeholder="https://example-store.myshopify.com" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10"></label><label class="block text-sm">ID utilisateur MAZIGHO<input id="user" required class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10"></label><label class="block text-sm">Nom du projet (facultatif)<input id="name" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10"></label><button class="w-full rounded-lg bg-cyan-400 px-4 py-3 font-bold text-slate-950 hover:bg-cyan-300">Lancer le clonage</button></form><section id="progress" class="mt-8 hidden rounded-2xl bg-white/5 p-6 ring-1 ring-white/10"><div class="flex justify-between text-sm"><span id="message">En préparation…</span><span id="percent">0%</span></div><div class="mt-3 h-3 overflow-hidden rounded-full bg-slate-800"><div id="bar" class="h-full w-0 bg-cyan-400 transition-all"></div></div><p id="warning" class="mt-4 text-sm text-amber-300"></p><p id="result" class="mt-4 text-sm"></p></section></main><script src="/static/app.js"></script></body></html>
