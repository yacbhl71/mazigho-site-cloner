<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — MAZIGHO Site Cloner</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
  <section class="w-full rounded-3xl bg-white/5 p-7 shadow-2xl ring-1 ring-white/10">
    <p class="text-sm font-semibold uppercase tracking-[.22em] text-cyan-300">MAZIGHO / espace privé</p>
    <h1 class="mt-3 text-3xl font-bold">Connexion au cloner</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">Cette interface est réservée à l’opérateur MAZIGHO. Saisissez vos identifiants pour accéder au formulaire de clonage.</p>
    <form id="login-form" class="mt-8 space-y-4">
      <label class="block text-sm">Identifiant<input id="username" required autocomplete="username" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10 outline-none focus:ring-cyan-400"></label>
      <label class="block text-sm">Mot de passe<input id="password" required type="password" autocomplete="current-password" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10 outline-none focus:ring-cyan-400"></label>
      <button class="w-full rounded-lg bg-cyan-400 px-4 py-3 font-bold text-slate-950 hover:bg-cyan-300">Se connecter</button>
      <p id="error" class="min-h-5 text-sm text-rose-300"></p>
    </form>
  </section>
</main>
<script src="/static/login.js"></script>
</body>
</html>
