<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — MAZIGHO Site Cloner</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
  <section class="w-full rounded-3xl bg-white/5 p-7 shadow-2xl ring-1 ring-white/10">
    <p class="text-sm font-semibold uppercase tracking-[.22em] text-cyan-300">MAZIGHO / espace privé</p>
    <h1 class="mt-3 text-3xl font-bold">Connexion au cloner</h1>
    <p class="mt-3 text-sm leading-6 text-slate-400">Cette interface est réservée à l’opérateur MAZIGHO. Saisissez vos identifiants pour accéder au formulaire de clonage.</p>
    <form id="login-form" class="mt-8 space-y-4">
      <label class="block text-sm">Identifiant<input id="username" required autocomplete="username" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10 outline-none focus:ring-cyan-400"></label>
      <label class="block text-sm">Mot de passe<input id="password" required type="password" autocomplete="current-password" class="mt-2 w-full rounded-lg bg-slate-900 p-3 ring-1 ring-white/10 outline-none focus:ring-cyan-400"></label>
      <label class="flex items-center gap-2 text-sm text-slate-300"><input id="show-password" type="checkbox" class="h-4 w-4 accent-cyan-400"> Afficher les caractères</label>
      <button class="w-full rounded-lg bg-cyan-400 px-4 py-3 font-bold text-slate-950 hover:bg-cyan-300">Se connecter</button>
      <button id="forgot-toggle" type="button" class="w-full text-sm text-cyan-300 underline hover:text-cyan-200">Mot de passe oublié ?</button>
      <p id="error" class="min-h-5 text-sm text-rose-300"></p>
    </form>
    <form id="reset-form" class="mt-6 hidden space-y-4 rounded-2xl border border-white/10 bg-slate-900/70 p-4">
      <p class="text-sm font-semibold">Réinitialiser le mot de passe</p>
      <p class="text-xs leading-5 text-slate-400">Utilisez le code de récupération conservé dans vos secrets Render.</p>
      <input id="recovery-code" required placeholder="Code de récupération" class="w-full rounded-lg bg-slate-950 p-3 text-sm ring-1 ring-white/10">
      <input id="new-password" required minlength="10" type="password" placeholder="Nouveau mot de passe (10 caractères min.)" class="w-full rounded-lg bg-slate-950 p-3 text-sm ring-1 ring-white/10">
      <label class="flex items-center gap-2 text-sm text-slate-300"><input id="show-new-password" type="checkbox" class="h-4 w-4 accent-cyan-400"> Afficher le nouveau mot de passe</label>
      <button class="w-full rounded-lg border border-cyan-400 px-4 py-2 text-sm font-semibold text-cyan-200 hover:bg-cyan-400/10">Réinitialiser</button>
      <p id="reset-message" class="min-h-5 text-sm text-amber-300"></p>
    </form>
  </section>
</main>
<script src="/static/login.js"></script>
</body>
</html>
